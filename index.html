<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4-Bios</title>

<style>
  :root {
    --main-orange: #ff5500;
    --light-orange: #ff8800;
    --dark-orange: #cc4400;
    --bg-dark: #121212;
    --card-bg: #1e1e1e;
    --text-light: #ffffff;
    --text-muted: #aaaaaa;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
    display: none; /* إخفاء الصفحة حتى اكتمال التفعيل */
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    direction: rtl;
    position: relative;
  }

  /* الشريط العلوي */
  .top-bar {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
  }

  .device-badge {
    padding: 6px 14px;
    background: rgba(0, 0, 0, 0.85);
    color: var(--light-orange);
    border: 1px solid var(--main-orange);
    border-radius: 8px;
    font-weight: bold;
    font-family: monospace;
    font-size: 0.9rem;
    box-shadow: 0 0 10px rgba(255, 85, 0, 0.3);
  }

  .console-btn {
    padding: 6px 14px;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    border: 1px solid var(--light-orange);
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 136, 0, 0.3);
    transition: 0.2s;
  }

  .console-btn:hover {
    background: var(--main-orange);
    color: #fff;
  }

  /* الكارت الرئيسي */
  .card {
    background-color: var(--card-bg);
    border-radius: 20px;
    padding: 40px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 85, 0, 0.2);
    border: 1px solid rgba(255, 85, 0, 0.3);
  }

  .logo-container {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--light-orange), var(--dark-orange));
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px rgba(255, 85, 0, 0.5);
  }

  .logo-container svg {
    width: 55px;
    height: 55px;
    fill: #ffffff;
  }

  h1 {
    font-size: 2.2rem;
    color: var(--light-orange);
    margin-bottom: 5px;
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 25px;
  }

  .info-box {
    background-color: #2a2a2a;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    border-right: 4px solid var(--main-orange);
  }

  .info-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  .info-item:last-child {
    margin-bottom: 0;
  }

  .info-label {
    color: var(--text-muted);
  }

  .info-value {
    font-weight: bold;
    color: var(--text-light);
  }

  .status-text {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--light-orange);
    margin: 15px 0;
  }

  .progress-container {
    background-color: #2a2a2a;
    border-radius: 10px;
    height: 12px;
    width: 100%;
    overflow: hidden;
    margin-bottom: 15px;
  }

  .progress-bar {
    background: linear-gradient(90deg, var(--dark-orange), var(--light-orange));
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
  }

  .timer {
    font-size: 2rem;
    font-weight: bold;
    font-family: monospace;
    color: var(--text-light);
  }

  /* نافذة الـ Console */
  #console-box {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 15px;
    right: 15px;
    height: 130px;
    background: rgba(0, 0, 0, 0.95);
    border: 1px solid var(--main-orange);
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 13px;
    color: #ff8800;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 0 0 15px rgba(255, 85, 0, 0.2);
    direction: ltr;
  }
</style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="top-bar">
  <button class="console-btn" onclick="toggleConsole()">Console</button>
  <div class="device-badge" id="device-key-badge">AT-0000</div>
</div>

<div class="card">
  <div class="logo-container">
    <svg viewBox="0 0 24 24">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </svg>
  </div>

  <h1>PS4-Bios</h1>
  <div class="subtitle">تفعيلات وتعديلات البلايستيشن</div>

  <div class="info-box">
    <div class="info-item">
      <span class="info-label">إصدار النظام:</span>
      <span class="info-value" id="fw-version">جاري الفحص...</span>
    </div>
    <div class="info-item">
      <span class="info-label">نوع الثغرة:</span>
      <span class="info-value" id="exploit-type">جاري الفحص...</span>
    </div>
  </div>

  <div class="status-text" id="status-text">جاري فحص النظام...</div>

  <div class="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="timer" id="timer">00:00</div>
</div>

<!-- نافذة عرض العمليات المخفية -->
<div id="console-box">
  <div>[SYSTEM] Console initialized...</div>
</div>

<!-- Iframe مخفي لتشغيل الثغرة والعمليات في الخلفية -->
<iframe id="bg-executor" style="display:none;"></iframe>

<script>
const FIREBASE_URL = "https://ps4-control-7ad50-default-rtdb.firebaseio.com";
const SECRET_SALT = "MyPS4MasterKey2026";

function logToConsole(msg) {
  const cBox = document.getElementById("console-box");
  if (cBox) {
    cBox.innerHTML += `<div>> ${msg}</div>`;
    cBox.scrollTop = cBox.scrollHeight;
  }
}

function toggleConsole() {
  const cBox = document.getElementById("console-box");
  cBox.style.display = cBox.style.display === "block" ? "none" : "block";
}

function getDeviceKeyNumber() {
  let savedKey = localStorage.getItem("device_key_num");
  if (!savedKey) {
    let str = navigator.userAgent + screen.width + screen.height;
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = (hash << 5) - hash + str.charCodeAt(i);
      hash |= 0;
    }
    savedKey = (Math.abs(hash) % 8999) + 1000;
    localStorage.setItem("device_key_num", savedKey);
  }
  return parseInt(savedKey, 10);
}

// 1. فحص الحظر من السيرفر
async function checkFirebaseBlockStatus(deviceKeyStr) {
  if (!navigator.onLine) return true;

  try {
    let res = await fetch(`${FIREBASE_URL}/devices/${deviceKeyStr}.json?t=${Date.now()}`);
    if (res.ok) {
      let deviceData = await res.json();

      if (deviceData && deviceData.status === "blocked") {
        document.write(`
          <div style="text-align:center; margin-top:35vh; color:#ff3333; font-family:sans-serif; background:#000; height:100vh; padding-top:20px;">
            <h1>تم حظر هذا الجهاز من قبل المسؤول!</h1>
            <p style="color:#ff8800; font-family:monospace;">Device ID: ${deviceKeyStr}</p>
          </div>
        `);
        window.stop();
        return false;
      }

      if (!deviceData) {
        await fetch(`${FIREBASE_URL}/devices/${deviceKeyStr}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            status: "active",
            registered_at: new Date().toISOString()
          })
        });
      }
    }
  } catch (e) {
    logToConsole("Firebase offline or bypassed.");
  }
  return true;
}

// 2. خوارزمية التفعيل
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(16).toUpperCase();
}

function validateKeyLocally(deviceNum, enteredKey) {
  let cleanKey = enteredKey.trim().toUpperCase();

  let expectedPermKey = "P-" + simpleHash(deviceNum + SECRET_SALT).substring(0, 6);
  if (cleanKey === expectedPermKey) return { valid: true, type: "perm" };

  let usageCounter = localStorage.getItem("one_time_counter") || "0";
  let expectedOnceKey = "1T-" + simpleHash(deviceNum + usageCounter + SECRET_SALT).substring(0, 6);

  if (cleanKey === expectedOnceKey) {
    return { valid: true, type: "once", currentCounter: usageCounter };
  }

  return { valid: false };
}

function unlockAndShowPage(deviceKeyStr) {
  document.body.style.display = "flex";
  document.getElementById("device-key-badge").textContent = deviceKeyStr;
  runExploitCore();
}

// 3. محرك الحماية والتفعيل
(async function initProtection() {
  const deviceNum = getDeviceKeyNumber();
  const deviceKeyStr = "AT-" + deviceNum;

  let isAllowed = await checkFirebaseBlockStatus(deviceKeyStr);
  if (!isAllowed) return;

  if (localStorage.getItem("is_activated_perm") === "true") {
    unlockAndShowPage(deviceKeyStr);
    return;
  }

  let promptMessage = `الجهاز غير مفعل!\n\nDevice Key: ${deviceKeyStr}\n\nأرسل هذا الكود عبر الواتساب على هاذ الرقم 01223739286 للحصول على كود تفعيل البايوس:`;
  let userKey = prompt(promptMessage);

  if (userKey) {
    let result = validateKeyLocally(deviceNum, userKey);

    if (result.valid) {
      if (result.type === "perm") {
        localStorage.setItem("is_activated_perm", "true");
        alert("تم التفعيل الكلي والدائم بنجاح!");
      } else if (result.type === "once") {
        let nextCounter = parseInt(result.currentCounter, 10) + 1;
        localStorage.setItem("one_time_counter", nextCounter.toString());
        alert("تم التفعيل لهذه المرة بنجاح!");
      }
      unlockAndShowPage(deviceKeyStr);
    } else {
      document.write("<h2 style='color:red; text-align:center; margin-top:40vh; background:#000; font-family:sans-serif;'>عفواً، كود التفعيل غير صحيح أو مستخدم من قبل!</h2>");
      window.stop();
    }
  } else {
    document.write("<h2 style='color:red; text-align:center; margin-top:40vh; background:#000; font-family:sans-serif;'>تم إغلاق الصفحة لعدم إدخال كود التفعيل!</h2>");
    window.stop();
  }
})();

// 4. تشغيل الثغرة وتحديث العداد والتصميم
function runExploitCore() {
  var statusEl = document.getElementById("status-text");
  var progressEl = document.getElementById("progress-bar");
  var timerEl = document.getElementById("timer");
  var fwEl = document.getElementById("fw-version");
  var exploitEl = document.getElementById("exploit-type");

  let seconds = 0;
  setInterval(() => {
    seconds++;
    let m = String(Math.floor(seconds / 60)).padStart(2, '0');
    let s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);

  function setProgress(percent, text) {
    progressEl.style.width = percent + "%";
    if (text) {
      statusEl.textContent = text;
      logToConsole(text);
    }
  }

  var params = new URLSearchParams(location.search);
  var key = null, fwnum = null;
  var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
  
  if (m) { 
    var minor = parseInt(m[2], 16), ms = minor.toString(16); 
    if (ms.length < 2) ms = "0" + ms; 
    key = m[1] + "." + ms; 
    fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10); 
  }

  var bug = null, forced = params.get("bug");
  
  if (forced === "lapse" || forced === "poops") { bug = forced; } 
  else if (fwnum <= 1202) { bug = "lapse"; } 
  else if (fwnum >= 1250) { bug = "poops"; }

  fwEl.textContent = key ? "V_" + key : "متصفح عادي";
  exploitEl.textContent = bug ? bug.toUpperCase() + "_CHAIN" : "غير معروف";

  if (!bug) {
    setStatus("إصدار غير مدعوم!");
    return;
  }

  var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;

  function go() { 
    setProgress(100, "جارٍ تشغيل الثغرة في الخلفية...");
    document.getElementById("bg-executor").src = target;
  }

  var ac = window.applicationCache;
  if (!ac || !document.documentElement.hasAttribute("manifest")) { go(); }
  else if (!navigator.onLine) { setProgress(100, "وضع الأوفلاين نشط"); go(); }
  else if (ac.status === ac.IDLE) { setProgress(100, "الكاش جاهز للاستخدام"); go(); }
  else {
    ac.addEventListener("downloading", function () { setProgress(30, "جارٍ سحب الملفات للمرة الأولى..."); }, false);
    ac.addEventListener("progress", function (e) { 
      if (e && e.total) { 
        let p = Math.round((e.loaded / e.total) * 100);
        setProgress(p, "جارٍ التخزين: " + p + "%"); 
      } 
    }, false);
    ac.addEventListener("cached", function () { setProgress(100, "اكتمل التخزين أوفلاين"); go(); }, false);
    ac.addEventListener("noupdate", function () { setProgress(100, "التخزين محدث وجاهز"); go(); }, false);
    ac.addEventListener("error", function () { setProgress(100, "تخطي الكاش للتشغيل..."); go(); }, false);
  }
}
</script>
</body>
</html>
